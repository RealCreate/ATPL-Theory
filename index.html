<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATPL Theory</title>
<meta name="description" content="EASA ATPL(A) theory, organised by the official learning objectives.">
<meta name="theme-color" id="themeColor" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ATPL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>try{var t=localStorage.getItem("atpl-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <button class="back" id="back" hidden aria-label="Back">
      <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="backLabel">Subjects</span>
    </button>
    <div class="bar-title" id="barTitle"></div>
    <div class="bar-actions">
      <div class="themewrap">
        <button class="icon-btn themebtn" id="themeBtn" data-mode="auto" aria-label="Appearance: Automatic" title="Appearance">
          <svg viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="tb-bite" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#fff"/><circle class="bite" cx="17" cy="7" r="6.8" fill="#000"/></mask></defs><g class="rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></g><g mask="url(#tb-bite)"><circle class="core" cx="12" cy="12" r="8" fill="currentColor"/></g><circle class="ring" cx="12" cy="12" r="7.6" fill="none" stroke="currentColor" stroke-width="1.9"/><path class="half" d="M12 4.4a7.6 7.6 0 0 1 0 15.2z" fill="currentColor"/></svg>
        </button>
        <span class="themetip" id="themeTip" aria-live="polite"></span>
      </div>
      <button class="icon-btn" id="searchBtn" aria-label="Search (/)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="layout" id="layout">
  <aside class="side" id="side" aria-label="Contents"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="sheet-wrap" id="searchSheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Search">
    <div class="sheet-head">
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search learning objectives" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </div>
      <button class="text-btn" data-close>Cancel</button>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" data-close aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <div class="lb-scroll"><img id="lbImg" alt=""></div>
</div>

<script src="app.js" defer></script>
</body>
</html>
