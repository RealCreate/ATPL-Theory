<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATPL Theory</title>
<meta name="description" content="EASA ATPL(A) theory, organised by the official learning objectives.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ATPL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <button class="back" id="back" hidden aria-label="Back">
      <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="backLabel">Subjects</span>
    </button>
    <div class="bar-title" id="barTitle"></div>
    <div class="bar-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search (/)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="layout" id="layout">
  <aside class="side" id="side" aria-label="Contents"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="sheet-wrap" id="searchSheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Search">
    <div class="sheet-head">
      <div class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search learning objectives" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </div>
      <button class="text-btn" data-close>Cancel</button>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" data-close aria-label="Close">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <div class="lb-scroll"><img id="lbImg" alt=""></div>
</div>

<script src="app.js" defer></script>
</body>
</html>
